<hrs-layout>
  <hrs-players-table
    [rows]="store.rows()"
    [total]="store.all().length"
    [search]="store.search()"
    (searchChange)="store.setSearch($event)"
    [loaded]="store.loaded()"
    [error]="store.error()"
    (meChange)="store.setMe($event.id, $event.isMe)"
    (importRequested)="store.importReplays()"
  />
</hrs-layout>

<hrs-layout>
  @if (store.error(); as error) {
    <p role="alert">The player could not be read: {{ error }}</p>
  } @else if (!store.loaded()) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading the player" />
  } @else if (store.player(); as player) {
    <!-- in the shell's left-hand drawer, over the sections -->
    <ng-template hrsShellSide="header"><hrs-player-card [player]="player" /></ng-template>
    <!-- a handset has no such drawer: the card over the section instead -->
    <hrs-player-card class="player__card" hrsLayoutItem="padded" [player]="player" />
    <hrs-match-filters
      hrsLayoutItem="padded"
      heroLabel="Hero"
      [options]="store.options()"
      [filter]="store.filter()"
      (filterChange)="store.setFilter($event)"
    />
    <!-- edge to edge: each section lays itself out -->
    <div hrsLayoutItem="edge-to-edge"><router-outlet /></div>
  } @else {
    <hrs-empty-state icon="person_off" title="Player not found">
      Nobody by this id is in the stored replays.
    </hrs-empty-state>
  }
</hrs-layout>

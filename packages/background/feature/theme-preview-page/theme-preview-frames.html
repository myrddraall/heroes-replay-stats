<section class="hrs-panel panel frames" aria-labelledby="frames-title">
  <h2 id="frames-title">Frames</h2>
  @switch (status()?.status) {
    @case ('error') {
      <p class="muted" role="alert">The frames' sheet couldn't be loaded.</p>
    }
    @case ('ready') {
      <div class="frames__grid">
        <figure>
          <div class="sample sample--wide" hrsSlice="validation#panel">
            A panel with a game border over it. Drag the corner to resize.
          </div>
          <figcaption>Set: back and front</figcaption>
        </figure>

        <figure>
          <div class="sample sample--tall" hrsSlice="validation#panel">Tall</div>
          <figcaption>The same set, tall</figcaption>
        </figure>

        <figure>
          <div class="sample sample--clipped" hrsSlice="validation#panel">
            Content goes in the frame's centre, padded in from its edges. When there is more of
            it than the centre holds, it is cut off at the centre's edge rather than running over
            the frame: this text is longer than the panel, so its last lines are hidden.
          </div>
          <figcaption>Content that doesn't fit is clipped to the centre</figcaption>
        </figure>

        <figure>
          <div class="buttons">
            <button type="button" class="game-button" hrsSlice="validation#topnav-button">
              Play
            </button>
            <button
              type="button"
              class="game-button"
              hrsSlice="validation#topnav-button"
              aria-pressed="true"
            >
              Selected
            </button>
            <button type="button" class="game-button" hrsSlice="validation#topnav-button" disabled>
              Disabled
            </button>
          </div>
          <figcaption>A button's states, at the art's own size: hover and press it</figcaption>
        </figure>

        <figure>
          <div class="sample sample--wide" hrsSliceBack="validation#terran-tech">
            A game Border: each part placed, the side edges turned
          </div>
          <figcaption>Parts, tiled edges</figcaption>
        </figure>

        <figure>
          <div class="tints">
            <div class="sample sample--small" data-theme="blue" [hrsSliceFront]="tinted()">Blue</div>
            <div class="sample sample--small" data-theme="red" [hrsSliceFront]="tinted()">Red</div>
          </div>
          <figcaption>Tinted in the team's colour</figcaption>
        </figure>

        <figure>
          <div class="modes">
            <div class="sample sample--mode" [hrsSliceBack]="stretched()">Stretch</div>
            <div class="sample sample--mode" [hrsSliceBack]="tiled()">Tile</div>
            <div class="sample sample--mode" [hrsSliceBack]="rounded()">Round</div>
          </div>
          <figcaption>
            The game Border's edges stretched, tiled (the last tile cut off) and rounded (whole
            tiles, squeezed to fit)
          </figcaption>
        </figure>

        <figure>
          <div class="sample sample--wide" [hrsSliceBack]="debug()">Half scale, cuts outlined</div>
          <figcaption>Debug outline</figcaption>
        </figure>

        <figure>
          <div class="icons">
            <img hrsSprite="validation#settings" alt="Settings" />
            <img hrsSprite="validation#search" [spriteWidth]="32" alt="Search" />
            <img hrsSprite="validation#close" [spriteWidth]="32" alt="Close" />
          </div>
          <figcaption>Pictures from the same sheet, by name (sprites)</figcaption>
        </figure>
      </div>
    }
    @default {
      <p class="muted">Loading the frames' sheet…</p>
    }
  }
</section>

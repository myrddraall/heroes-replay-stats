<header class="map-panel__head">
  <h2 class="map-panel__title">{{ title() }}</h2>
  <button mat-icon-button type="button" aria-label="Close panel" (click)="closeRequested.emit()">
    <mat-icon class="material-symbols-outlined" aria-hidden="true">close</mat-icon>
  </button>
</header>
<div class="map-panel__pinned">
  <ng-content select="[hrsMapPanelPinned]" />
</div>
<div class="map-panel__body">
  <ng-content />
</div>

<main>
  <h1>Play screen background</h1>
  <hrs-play-background [names]="names()" />
  <button
    mat-icon-button
    type="button"
    class="back"
    aria-label="Back"
    matTooltip="Back"
    (click)="back()"
  >
    <mat-icon class="material-symbols-outlined" aria-hidden="true">arrow_back</mat-icon>
  </button>
  <div class="corner">
    <div class="row">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="review">
        <mat-label>Review</mat-label>
        <mat-select [value]="review()" (selectionChange)="review.set($event.value)">
          <mat-option value="">Sets</mat-option>
          @for (planet of planets.hasValue() ? planets.value().planets : []; track planet.id) {
            <mat-option [value]="planet.id">{{ planet.id }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-slide-toggle class="names" [checked]="names()" (change)="names.set($event.checked)">
        Names
      </mat-slide-toggle>
      <button mat-stroked-button type="button" class="open" (click)="anotherSet()" [disabled]="review() !== ''">
        <mat-icon class="material-symbols-outlined" aria-hidden="true">shuffle</mat-icon>
        Planets
      </button>
    </div>
    <button
      mat-stroked-button
      type="button"
      class="open"
      aria-controls="tint-controls"
      [attr.aria-expanded]="open()"
      (click)="open.set(!open())"
    >
      <mat-icon class="material-symbols-outlined" aria-hidden="true">palette</mat-icon>
      Colours
    </button>
    @if (open()) {
      <hrs-tint-controls
        id="tint-controls"
        class="hrs-glass"
        [class]="'hrs-glass-' + graphics.theme()"
        [(settings)]="settings"
        [presets]="presets"
        (presetChosen)="choose($event)"
      />
    }
  </div>
</main>

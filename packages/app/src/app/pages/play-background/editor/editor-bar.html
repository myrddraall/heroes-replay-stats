<div class="row">
  <span class="status" [class.status--unsaved]="draft.unsaved() > 0">
    @if (draft.unsaved(); as n) {
      {{ n }} not saved
    } @else {
      All saved
    }
  </span>
  <button type="button" class="button" (click)="draft.discard()" [disabled]="!draft.unsaved()">
    Discard
  </button>
  <button
    type="button"
    class="button button--primary"
    (click)="draft.save()"
    [disabled]="!draft.unsaved()"
  >
    Save
  </button>
  <hrs-view-menu />
</div>

<div class="buttons">
  <hrs-split-button
    [options]="options()"
    menuLabel="Other parts"
    (chosen)="add($event)"
    (picked)="reuse($event)"
  />
</div>
@if (savable()) {
  <div class="buttons">
    <button type="button" class="button" (click)="saved.emit()">Save as overlay</button>
  </div>
}

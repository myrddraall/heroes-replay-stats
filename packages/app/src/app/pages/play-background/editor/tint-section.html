@let t = tint();
<hrs-property-section
  [title]="title()"
  [changed]="set() !== undefined"
  (resetRequested)="clear.emit()"
>
  <hrs-property-colour
    label="Colour"
    [value]="t.colour"
    [changed]="isSet('colour')"
    (resetRequested)="reset('colour')"
    (valueChange)="change({ colour: $event })"
  />
  <hrs-property-select
    label="Blend"
    [value]="t.blend"
    [options]="blends"
    [changed]="isSet('blend')"
    (resetRequested)="reset('blend')"
    (valueChange)="blend($event)"
  />
  <hrs-property-slider
    label="Strength"
    [value]="t.strength"
    [min]="0"
    [max]="1"
    [step]="0.01"
    [changed]="isSet('strength')"
    (resetRequested)="reset('strength')"
    (valueChange)="change({ strength: $event })"
  />
</hrs-property-section>

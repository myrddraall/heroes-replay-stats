<hrs-property-section
  [title]="title()"
  [changed]="changed()"
  (resetRequested)="resetRequested.emit()"
>
  @for (p of shown(); track p.value) {
    <div class="picked">
      <span class="name">{{ p.label }}</span>
      <button
        type="button"
        class="remove"
        [attr.aria-label]="removeLabel() + ' ' + p.label"
        [title]="removeLabel()"
        (click)="removed.emit(p.value)"
      >
        <mat-icon class="material-symbols-outlined" aria-hidden="true">close</mat-icon>
      </button>
    </div>
  } @empty {
    <p class="hint">None</p>
  }
  @if (others().length) {
    <div class="add">
      <label class="label" [for]="id">Add</label>
      <select class="select" [id]="id" (change)="add($event)">
        <option value="" selected>{{ placeholder() }}</option>
        @for (o of others(); track o.value) {
          <option [value]="o.value">{{ o.label }}</option>
        }
      </select>
    </div>
  }
</hrs-property-section>

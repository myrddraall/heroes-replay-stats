<div class="split" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  @if (main(); as m) {
    <button
      type="button"
      class="split__main"
      [disabled]="m.disabled"
      [attr.aria-haspopup]="m.pick ? 'dialog' : null"
      [attr.aria-expanded]="m.pick ? picking()?.id === m.id : null"
      (click)="choose(m)"
    >
      <mat-icon class="material-symbols-outlined" aria-hidden="true">{{ m.icon }}</mat-icon>
      <span>{{ m.label }}</span>
    </button>
  }
  @if (options().length > 1) {
    <button
      type="button"
      class="split__arrow"
      [attr.aria-label]="menuLabel()"
      [title]="menuLabel()"
      [matMenuTriggerFor]="menu"
    >
      <mat-icon class="material-symbols-outlined" aria-hidden="true">arrow_drop_down</mat-icon>
    </button>
  }
</div>
<mat-menu #menu="matMenu" xPosition="after">
  @for (o of options(); track o.id) {
    <button mat-menu-item type="button" [disabled]="o.disabled" (click)="choose(o)">
      <mat-icon class="material-symbols-outlined" aria-hidden="true">{{ o.icon }}</mat-icon>
      <span>{{ o.label }}</span>
    </button>
  }
</mat-menu>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="picking() !== null"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPanelClass]="'hrs-glass-' + graphics.theme()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
>
  @if (picking(); as p) {
    <hrs-pick-flyout
      [title]="p.pick!.title"
      [icon]="p.pick!.icon"
      [items]="p.pick!.items"
      (picked)="pick($event)"
      (closed)="close()"
    />
  }
</ng-template>

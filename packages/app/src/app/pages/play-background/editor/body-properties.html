<hrs-property-section
  title="General"
  [changed]="set().label !== undefined"
  (resetRequested)="clear.emit(['label'])"
>
  <hrs-property-text
    label="Name"
    [value]="set().label ?? ''"
    [placeholder]="labelBelow()"
    [changed]="set().label !== undefined"
    [origin]="origins()?.label"
    (resetRequested)="clear.emit(['label'])"
    (valueChange)="rename($event)"
  />
  <div class="buttons">
  @if (orbit()) {
    <button
      type="button"
      class="button"
      (click)="focusToggle.emit()"
      [attr.aria-pressed]="focused()"
    >
      {{ focused() ? 'Unfocus' : 'Focus' }}
    </button>
    <button type="button" class="button" (click)="removeRequested.emit()">Remove moon</button>
  }
  @if (place()) {
    <button type="button" class="button" (click)="removeRequested.emit()">Remove planet</button>
  }
    <button type="button" class="button" (click)="resetRequested.emit()" [disabled]="!changed()">
      Reset look
    </button>
  </div>
</hrs-property-section>
@let v = values();
@if (styled()) {
  <hrs-property-section title="Body" [changed]="styleSet()" (resetRequested)="styleReset.emit()">
    <hrs-property-select
      label="Style"
      [value]="v.style"
      [options]="styleOptions()"
      [changed]="styleSet()"
      (resetRequested)="styleReset.emit()"
      (valueChange)="styleChange.emit($event)"
    />
  </hrs-property-section>
}
@if (orbit(); as o) {
  <hrs-property-section title="Orbit" [changed]="orbitSet()" (resetRequested)="resetOrbit()">
    <hrs-property-number
      label="Progress"
      [value]="o.progress"
      [min]="0"
      [max]="1"
      [step]="0.01"
      [changed]="orbitSet('progress')"
      (resetRequested)="resetOrbit('progress')"
      (valueChange)="orbitChange.emit({ progress: $event })"
    />
    <hrs-property-number
      label="Distance"
      [value]="o.radius"
      [min]="1"
      [step]="0.05"
      [changed]="orbitSet('radius')"
      (resetRequested)="resetOrbit('radius')"
      (valueChange)="orbitChange.emit({ radius: $event })"
    />
    <hrs-property-number
      label="Tilt"
      [value]="o.tilt"
      [min]="-90"
      [max]="90"
      [step]="1"
      [changed]="orbitSet('tilt')"
      (resetRequested)="resetOrbit('tilt')"
      (valueChange)="orbitChange.emit({ tilt: $event })"
    />
    <hrs-property-number
      label="Turn"
      [value]="o.turn"
      [min]="-180"
      [max]="180"
      [step]="1"
      [changed]="orbitSet('turn')"
      (resetRequested)="resetOrbit('turn')"
      (valueChange)="orbitChange.emit({ turn: $event })"
    />
    <hrs-property-number
      label="Size"
      [value]="o.size"
      [min]="0.01"
      [step]="0.01"
      [changed]="orbitSet('size')"
      (resetRequested)="resetOrbit('size')"
      (valueChange)="orbitChange.emit({ size: $event })"
    />
  </hrs-property-section>
}
@if (place(); as p) {
  <hrs-property-section title="Place">
    <hrs-property-number
      label="Across"
      [value]="p.position[0]"
      [step]="0.5"
      (valueChange)="move(0, $event)"
    />
    <hrs-property-number
      label="Up"
      [value]="p.position[2]"
      [step]="0.5"
      (valueChange)="move(2, $event)"
    />
    <hrs-property-number
      label="Distance"
      [value]="p.position[1]"
      [step]="1"
      (valueChange)="move(1, $event)"
    />
    <hrs-property-number
      label="Size"
      [value]="p.radius"
      [min]="0.1"
      [step]="0.5"
      (valueChange)="placeChange.emit({ radius: $event })"
    />
  </hrs-property-section>
}
@if (moons()) {
  <hrs-property-section title="Moons">
    <div class="buttons">
      <ng-content select="[moonAdd]" />
    </div>
  </hrs-property-section>
}
@if (!overlay()) {
  <hrs-tint-section
    [tint]="v.tint"
    [base]="baseTint()"
    [set]="set().tint"
    (tintChange)="settingsChange.emit({ tint: $event })"
    (clear)="clear.emit(['tint'])"
  />
}
@if (!overlay()) {
  <hrs-property-section title="Rim" [changed]="isSet('rim')" (resetRequested)="clear.emit(['rim'])">
    <hrs-property-direction
      label="Direction"
      [sided]="false"
      [value]="rimFrom()"
      [changed]="isSet('rim')"
      [origin]="origins()?.rim"
      (resetRequested)="clear.emit(['rim'])"
      (valueChange)="settingsChange.emit({ rim: mirrored($event) })"
    />
  </hrs-property-section>
}
<ng-content select="[lightAdd]" />

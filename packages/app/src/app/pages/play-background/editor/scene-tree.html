<ul class="tree" aria-label="Scene">
  @for (row of rows(); track row.key) {
    @if (startsAids($index)) {
      <li class="aids" role="separator"></li>
    }
    <li
      class="row"
      [class.row--selected]="row.key === selected()"
      [class.row--aid]="row.aid"
      [style.--depth]="row.depth"
    >
      @if (row.expandable) {
        <button
          type="button"
          class="fold"
          [attr.aria-expanded]="row.expanded"
          [attr.aria-label]="(row.expanded ? 'Fold ' : 'Unfold ') + row.label"
          (click)="expandToggle.emit(row.key)"
        >
          <mat-icon class="material-symbols-outlined" aria-hidden="true">
            {{ row.expanded ? 'expand_more' : 'chevron_right' }}
          </mat-icon>
        </button>
      } @else {
        <span class="fold" aria-hidden="true"></span>
      }
      @if (row.enabled !== undefined) {
        <input
          type="checkbox"
          class="check"
          [checked]="row.enabled"
          (change)="enabled(row, $event)"
          [attr.aria-label]="'Draw ' + row.label"
        />
      }
      <button
        type="button"
        class="name"
        [class.name--off]="row.enabled === false"
        [attr.aria-pressed]="row.key === selected()"
        (click)="rowSelect.emit(row.key)"
        (keydown.arrowdown)="move($event, $index, 1)"
        (keydown.arrowup)="move($event, $index, -1)"
      >
        <mat-icon class="material-symbols-outlined icon" aria-hidden="true">{{
          row.icon
        }}</mat-icon>
        <span class="text">{{ row.label }}</span>
        @if (row.unsaved) {
          <span class="unsaved" title="Not saved yet" aria-label="not saved yet"></span>
        }
      </button>
    </li>
  }
</ul>

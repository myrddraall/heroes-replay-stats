<hrs-property-select
  label="Type"
  [value]="catalog.type()"
  [options]="types"
  (valueChange)="setType($event)"
/>
<input
  type="search"
  class="search"
  placeholder="Search"
  aria-label="Search the library"
  [value]="catalog.query()"
  (input)="search($event)"
/>
<div class="row">
  @if (catalog.type() === 'scene') {
    <button
      type="button"
      class="button new"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      aria-haspopup="dialog"
      [attr.aria-expanded]="flyout()"
      (click)="flyout.set(!flyout())"
    >
      <mat-icon class="material-symbols-outlined" aria-hidden="true">add</mat-icon>
      <span>New scene</span>
    </button>
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="flyout()"
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayPanelClass]="'hrs-glass-' + graphics.theme()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="flyout.set(false)"
      (detach)="flyout.set(false)"
    >
      <hrs-new-scene-flyout
        [templates]="templates()"
        (create)="create($event)"
        (closed)="flyout.set(false)"
      />
    </ng-template>
  }
  <span class="end"><hrs-view-menu /></span>
</div>

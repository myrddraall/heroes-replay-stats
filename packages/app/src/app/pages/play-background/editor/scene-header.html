@if (store.own()) {
  <hrs-property-select
    label="Planet"
    [value]="store.planetId()"
    [options]="store.planetOptions()"
    (valueChange)="store.setPlanet($event)"
  />
}
@if (store.focusedName(); as name) {
  <div class="focus">
    <span>Centred on {{ name }}</span>
    <button type="button" class="button" (click)="store.unfocus()">Unfocus</button>
  </div>
}

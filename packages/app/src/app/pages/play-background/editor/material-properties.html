@let v = values();
@let c = controls();
@if (origin(); as from) {
  <p class="data-name">{{ from }}</p>
}
@if (name(); as data) {
  <p class="data-name">
    In the game data: <span class="data-name__value">{{ data }}</span>
  </p>
}
<hrs-property-section
  title="General"
  [changed]="isSet('label')"
  (resetRequested)="clear.emit(['label'])"
>
  <hrs-property-text
    label="Name"
    [value]="set()?.label ?? ''"
    [placeholder]="labelBelow()"
    [changed]="isSet('label')"
    [origin]="origins()?.label"
    (resetRequested)="clear.emit(['label'])"
    (valueChange)="rename($event)"
  />
  @if (shared()) {
    <div class="buttons">
      <button type="button" class="button" (click)="sharedOpen.emit()">
        Edit shared material
        <mat-icon class="material-symbols-outlined" aria-hidden="true">arrow_outward</mat-icon>
      </button>
    </div>
  }
</hrs-property-section>
<hrs-property-section
  title="Surface"
  [changed]="anySet(['strength', 'blend', 'depth'])"
  (resetRequested)="clear.emit(['strength', 'blend', 'depth'])"
>
  @if (c.strength) {
    <hrs-property-number
      label="Opacity"
      [value]="v.strength"
      [min]="0"
      [max]="1"
      [step]="0.01"
      [changed]="isSet('strength')"
      [origin]="origins()?.strength"
      (resetRequested)="clear.emit(['strength'])"
      (valueChange)="settingsChange.emit({ strength: $event })"
    />
  }
  @if (!c.particles) {
    <hrs-property-select
      label="Draw mode"
      [value]="v.blend"
      [options]="blends"
      [changed]="isSet('blend')"
      [origin]="origins()?.blend"
      (resetRequested)="clear.emit(['blend'])"
      (valueChange)="blend($event)"
    />
  }
  @if (c.depth) {
    <hrs-property-select
      label="Depth"
      [value]="v.depth"
      [options]="depthOptions"
      [changed]="isSet('depth')"
      [origin]="origins()?.depth"
      (resetRequested)="clear.emit(['depth'])"
      (valueChange)="depth($event)"
    />
  }
</hrs-property-section>
@if (!c.particles) {
  <hrs-tint-section
    [tint]="v.tint"
    [base]="baseTint()"
    [set]="set()?.tint"
    (tintChange)="settingsChange.emit({ tint: $event })"
    (clear)="clear.emit(['tint'])"
  />
  <hrs-property-section
    title="Light"
    [changed]="anySet(['lit', 'glow'])"
    (resetRequested)="clear.emit(['lit', 'glow'])"
  >
    @if (c.lit) {
      <hrs-property-check
        label="Ignore lights"
        [checked]="!v.lit"
        [changed]="isSet('lit')"
        [origin]="origins()?.lit"
        (resetRequested)="clear.emit(['lit'])"
        (checkedChange)="settingsChange.emit({ lit: !$event })"
      />
    }
    <hrs-property-number
      label="Glow"
      [value]="v.glow"
      [min]="0"
      [step]="0.1"
      [changed]="isSet('glow')"
      [origin]="origins()?.glow"
      (resetRequested)="clear.emit(['glow'])"
      (valueChange)="settingsChange.emit({ glow: $event })"
    />
  </hrs-property-section>
  @if (c.spread) {
    <hrs-property-section
      title="Rim"
      [changed]="anySet(['spread', 'spreadFrom', 'falloff'])"
      (resetRequested)="clear.emit(['spread', 'spreadFrom', 'falloff'])"
    >
      <hrs-property-number
        label="Spread"
        [value]="v.spread"
        [min]="0"
        [max]="1"
        [step]="0.05"
        [changed]="isSet('spread')"
        [origin]="origins()?.spread"
        (resetRequested)="clear.emit(['spread'])"
        (valueChange)="settingsChange.emit({ spread: $event })"
      />
      <hrs-property-direction
        label="Direction"
        [sided]="false"
        [value]="v.spreadFrom"
        [changed]="isSet('spreadFrom')"
        [origin]="origins()?.spreadFrom"
        (resetRequested)="clear.emit(['spreadFrom'])"
        (valueChange)="settingsChange.emit({ spreadFrom: $event })"
      />
      <hrs-property-number
        label="Falloff"
        [value]="v.falloff"
        [min]="0"
        [step]="0.05"
        [changed]="isSet('falloff')"
        [origin]="origins()?.falloff"
        (resetRequested)="clear.emit(['falloff'])"
        (valueChange)="settingsChange.emit({ falloff: $event })"
      />
    </hrs-property-section>
  }
}
<div class="buttons">
  <button type="button" class="button" (click)="resetRequested.emit()" [disabled]="!changed()">
    Reset material
  </button>
</div>

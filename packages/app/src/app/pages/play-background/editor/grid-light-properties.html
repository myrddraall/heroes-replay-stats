@let l = values();
<hrs-property-section title="General">
  <hrs-property-text label="Name" [value]="l.name" (valueChange)="rename($event)" />
</hrs-property-section>
<hrs-property-section title="Light">
  <hrs-property-select
    label="Effect"
    [value]="l.darkens ? 'darkens' : 'lights'"
    [options]="effects"
    (valueChange)="lightChange.emit({ darkens: $event === 'darkens' })"
  />
  <hrs-property-number
    label="Strength"
    [value]="l.strength"
    [min]="0"
    [step]="0.05"
    (valueChange)="lightChange.emit({ strength: $event })"
  />
  @if (l.from; as from) {
    <hrs-property-direction
      label="Light from"
      [value]="from"
      (valueChange)="lightChange.emit({ from: $event })"
    />
    <hrs-property-number
      label="Reach"
      [value]="l.reach"
      [min]="0"
      [max]="1"
      [step]="0.01"
      (valueChange)="lightChange.emit({ reach: $event })"
    />
    <hrs-property-number
      label="Softness"
      [value]="l.softness"
      [min]="0.1"
      [step]="0.05"
      (valueChange)="lightChange.emit({ softness: $event })"
    />
  }
</hrs-property-section>
<hrs-property-section title="Shield">
  <hrs-property-check
    label="Reveals"
    [checked]="l.reveals"
    (checkedChange)="lightChange.emit({ reveals: $event })"
  />
  <hrs-property-check
    label="Activates"
    [checked]="l.activates"
    (checkedChange)="lightChange.emit({ activates: $event })"
  />
  @if (l.activates) {
    <hrs-property-number
      label="Energizes"
      [value]="l.energizes"
      [min]="0"
      [step]="0.05"
      (valueChange)="lightChange.emit({ energizes: $event })"
    />
    <hrs-property-number
      label="Glow"
      [value]="l.glow"
      [min]="0"
      [step]="0.05"
      (valueChange)="lightChange.emit({ glow: $event })"
    />
  }
</hrs-property-section>
<div class="buttons">
  <button type="button" class="button" (click)="removed.emit()">Remove light</button>
</div>

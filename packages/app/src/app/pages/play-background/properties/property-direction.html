<span class="label" [class.label--changed]="changed()" [id]="id"
  >{{ label() }}
  @if (origin() && !changed()) {
    <span class="origin" [title]="'Set in ' + origin()"
      ><span class="origin__text">, set in {{ origin() }}</span></span
    >
  }
</span>
<span class="control">
  <span
    class="disc"
    role="slider"
    tabindex="0"
    [attr.aria-labelledby]="id"
    aria-valuemin="0"
    aria-valuemax="360"
    [attr.aria-valuenow]="angle()"
    [attr.aria-valuetext]="text()"
    (pointerdown)="pointerDown($event)"
    (pointermove)="pointerMove($event)"
    (keydown)="key($event)"
  >
    <span class="cross" aria-hidden="true"></span>
    <span
      class="point"
      [class.point--behind]="behind()"
      [style.left.%]="50 + point().x * 50"
      [style.top.%]="50 + point().y * 50"
      aria-hidden="true"
    ></span>
  </span>
  @if (sided()) {
    <button type="button" class="side" (click)="flip()" [attr.aria-pressed]="behind()">
      {{ behind() ? 'Behind' : 'Front' }}
    </button>
  }
  <span class="readout" aria-hidden="true">
    @for (part of offsets(); track $index) {
      <span class="readout__line">{{ part }}</span>
    }
  </span>
</span>
<span class="reset-slot">
  @if (changed()) {
    <button
      type="button"
      class="reset"
      [attr.aria-label]="'Reset ' + label()"
      title="Reset"
      (click)="resetRequested.emit()"
    >
      <mat-icon class="material-symbols-outlined" aria-hidden="true">restart_alt</mat-icon>
    </button>
  }
</span>

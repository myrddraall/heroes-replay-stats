<label class="label" [class.label--changed]="changed()" [for]="id"
  >{{ label() }}
  @if (origin() && !changed()) {
    <span class="origin" [title]="'Set in ' + origin()"
      ><span class="origin__text">, set in {{ origin() }}</span></span
    >
  }
</label>
<select class="select" [id]="id" (change)="update($event)">
  @for (option of choices(); track option.key) {
    @if (option.value === null) {
      <hr />
    } @else {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  }
</select>
<span class="reset-slot">
  @if (changed()) {
    <button
      type="button"
      class="reset"
      [attr.aria-label]="'Reset ' + label()"
      title="Reset"
      (click)="resetRequested.emit()"
    >
      <mat-icon class="material-symbols-outlined" aria-hidden="true">restart_alt</mat-icon>
    </button>
  }
</span>

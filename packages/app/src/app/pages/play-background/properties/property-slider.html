<label class="label" [class.label--changed]="changed()" [for]="id">{{ label() }}</label>
<input
  type="range"
  class="range"
  [id]="id"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [value]="value()"
  (input)="update($event)"
/>
<input
  type="number"
  class="number"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [value]="shown()"
  (change)="update($event)"
  [attr.aria-label]="label() + ' value'"
/>
<span class="reset-slot">
  @if (changed()) {
    <button
      type="button"
      class="reset"
      [attr.aria-label]="'Reset ' + label()"
      title="Reset"
      (click)="resetRequested.emit()"
    >
      <mat-icon class="material-symbols-outlined" aria-hidden="true">restart_alt</mat-icon>
    </button>
  }
</span>

<hrs-layout>
  @if (store.scoreScreen(); as scoreScreen) {
    @if (scoreScreen.players.length > 0) {
      <hrs-score-screen [scoreScreen]="scoreScreen" [icons]="store.icons()" />
    } @else {
      <hrs-empty-state icon="scoreboard" title="No score screen">
        The score screen of this replay could not be read.
      </hrs-empty-state>
    }
  } @else {
    <mat-progress-bar mode="indeterminate" aria-label="Loading the score screen" />
  }
</hrs-layout>

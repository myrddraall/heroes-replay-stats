<ul class="links" [attr.aria-label]="label()">
  @for (link of links(); track link.path) {
    <li>
      <a
        class="links__link"
        [routerLink]="link.path"
        routerLinkActive="links__link--active"
        ariaCurrentWhenActive="page"
        >{{ link.title }}</a
      >
    </li>
  }
</ul>

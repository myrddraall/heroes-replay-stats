<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Translucency — preview</title></head>
<body>
<div class="hrs-stage">
<div class="hrs-row-flex" style="align-items:stretch">
<section class="hrs-panel" style="width:180px"><div class="hrs-panel__header">Opacity 0</div><div class="hrs-panel__body hrs-muted" style="font-size:13px">The default: the floor, alpha 0.72.</div></section>
<section class="hrs-panel" style="width:180px;--hrs-surface-alpha:0.86"><div class="hrs-panel__header">Opacity 0.5</div><div class="hrs-panel__body hrs-muted" style="font-size:13px">Halfway to solid, alpha 0.86.</div></section>
<section class="hrs-panel" style="width:180px;--hrs-surface-alpha:1"><div class="hrs-panel__header">Opacity 1</div><div class="hrs-panel__body hrs-muted" style="font-size:13px">Solid: scene off, or reduced transparency.</div></section>
<section class="hrs-panel" style="width:180px;--hrs-backdrop:blur(8px)"><div class="hrs-panel__header">Blur on</div><div class="hrs-panel__body hrs-muted" style="font-size:13px">Opacity 0 with blur(8px).</div></section>
</div>
</div>
</body>
</html>

<div class="clip" [style.clip-path]="clip()" [style.opacity]="opacity()">
  <img
    class="image"
    alt=""
    [src]="url()"
    [style.height.%]="scale() * 100"
    [style.left.%]="50 + across() * 100"
    [style.top.%]="50 - up() * 100"
  />
</div>
@if (mode() === 'split') {
  <div class="line" [style.left.%]="amount() * 100"></div>
}

@let v = variant();
<forge-property-section title="General">
  @if (editable()) {
  <forge-property-text label="Name" [value]="v.name" (valueChange)="renamed.emit($event)" />
  }
  <forge-property-check label="On" [checked]="v.on" (checkedChange)="toggled.emit($event)" />
  @if (editable()) {
  <div class="buttons">
    <button
      type="button"
      class="button"
      [attr.aria-pressed]="edited()"
      (click)="editToggled.emit()"
    >
      {{ edited() ? 'Back to its own settings' : 'Edit this variant' }}
    </button>
    @if (v.removable) {
    <button type="button" class="button" (click)="removed.emit()">Delete</button>
    }
  </div>
  }
</forge-property-section>

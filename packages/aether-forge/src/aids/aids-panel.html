@switch (editor.kind()) { @case ('backdrop') { @if (backdrop(); as values) {
<forge-editing-aid-properties
  title="Backdrop"
  [fills]="backdropFills"
  [skies]="skies()"
  [values]="values"
  [changed]="backdropChanged()"
  (valuesChange)="setAid('backdrop', $event)"
  (clear)="clearAid('backdrop', $event)"
/>
} @if (editor.preview()?.backdrop === 'sky') {
<div class="buttons">
  <button
    type="button"
    class="button"
    (click)="editor.resetSky()"
    [disabled]="!editor.skyChanged()"
  >
    Reset sky
  </button>
</div>
}
<ng-container [ngTemplateOutlet]="previewButtons" />
} @case ('stand-in') { @if (worn()) {
<forge-property-select
  label="Planet"
  [value]="editor.preview()?.planet ?? ''"
  [options]="planets()"
  [changed]="editor.previewOwn().planet !== undefined"
  (valueChange)="setPlanet($event)"
  (resetRequested)="editor.clearPreview(['planet'])"
/>
} @if (!editor.preview()?.planet || !worn()) { @if (standIn(); as values) {
<forge-editing-aid-properties
  title="Stand-in planet"
  [fills]="standInFills"
  [values]="values"
  [changed]="standInChanged()"
  (valuesChange)="setAid('standIn', $event)"
  (clear)="clearAid('standIn', $event)"
/>
} }
<ng-container [ngTemplateOutlet]="previewButtons" />
} @case ('reference') {
<forge-reference-properties
  [name]="aids.referenceName()"
  [hasImage]="aids.referenceUrl() !== null"
  [values]="reference()"
  [changed]="referenceChanged()"
  (imageChosen)="aids.chooseReference($event, $event.name)"
  (imageRemoved)="aids.clearReference()"
  (valuesChange)="setReference($event)"
  (clear)="clearReference($event)"
/>
} }

<ng-template #previewButtons>
  <div class="buttons">
    <button type="button" class="button" (click)="editor.clearPreview()" [disabled]="!previewSet()">
      Reset
    </button>
    <button
      type="button"
      class="button"
      (click)="editor.usePreviewForKind()"
      [disabled]="!previewSet()"
    >
      Use for all {{ editor.previewKind() }}
    </button>
  </div>
</ng-template>

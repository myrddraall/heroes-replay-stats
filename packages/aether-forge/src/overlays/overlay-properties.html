<forge-property-section title="General">
  <forge-property-check
    label="Drawn"
    [checked]="overlay().enabled"
    (checkedChange)="enabledChange.emit($event)"
  />
  <div class="buttons">
    <button type="button" class="button" (click)="openRequested.emit()">Open in library</button>
    <button type="button" class="button" (click)="takeOffRequested.emit()">Take off</button>
  </div>
</forge-property-section>

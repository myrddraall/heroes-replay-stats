@let pod = importPod();
<div class="hrs-pod import-pod" [attr.role]="pod ? 'status' : null" aria-live="polite">
  <a
    class="import-pod__status"
    routerLink="/import"
    [attr.aria-label]="pod ? pod.label + ', show imports' : null"
  >
    <mat-icon class="material-symbols-outlined import-pod__icon" aria-hidden="true">upload_file</mat-icon>
    <span>{{ pod ? (handset() ? pod.short : pod.label) : 'Import' }}</span>
  </a>
  <button
    type="button"
    class="hrs-badge hrs-badge--corner hrs-badge--filled import-pod__more"
    [attr.aria-label]="pod ? 'Import more replays' : 'Import replays'"
    [matTooltip]="pod ? 'Import more replays' : 'Import replays'"
    (click)="imports.import()"
  >
    +
  </button>
  @if (pod) {
    <span class="hrs-pod__bar" aria-hidden="true"><span [style.width.%]="pod.percent"></span></span>
  }
</div>

<hrs-settings-form
  [parallelImports]="store.parallelImports()"
  [min]="store.min"
  [max]="store.max"
  [deviceDefault]="store.deviceDefault"
  [cores]="store.cores"
  (parallelImportsChange)="store.setParallelImports($event)"
>
  @for (section of sections(); track section.id) {
    <ng-container *ngComponentOutlet="section.component" />
  }
</hrs-settings-form>

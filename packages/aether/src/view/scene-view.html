@if (scene.hasValue()) {
<aether-scene-canvas
  [scene]="scene.value()"
  [grading]="grading()"
  [sky]="sky()"
  [lights]="sceneLights()"
  [backdrop]="backdrop()"
  [beams]="beams()"
  [dim]="dim()"
  [camera]="camera()"
  [skyFollow]="skyFollow()"
  [sceneKey]="sceneKey()"
  [animate]="drawing().animate"
  [fps]="store.fps()"
  [fadeFps]="store.fadeFps()"
  [resolution]="drawing().resolution"
  [picture]="store.picture()"
  [placements]="shown()"
  [names]="names()"
  [pickable]="pickable()"
  (planetPick)="planetPick.emit($event)"
  (pickMissed)="pickMissed.emit()"
  (planetHover)="planetHover.emit($event)"
/>
}

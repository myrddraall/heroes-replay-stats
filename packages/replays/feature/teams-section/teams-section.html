<!-- padded, not constrained: its tables grow to the whole width -->
<hrs-layout default="padded">
  @if (store.error(); as error) {
    <p role="alert">The team stats could not be read: {{ error }}</p>
  } @else if (store.teams(); as teams) {
    @if (teams.length > 0) {
      <hrs-team-stats [teams]="teams" [group]="group()" />
    } @else {
      <hrs-empty-state icon="groups" title="No team stats">
        The team stats of this replay could not be read.
      </hrs-empty-state>
    }
  } @else {
    <mat-progress-bar mode="indeterminate" aria-label="Loading the team stats" />
  }
</hrs-layout>

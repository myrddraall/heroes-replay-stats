@if (asCards()) {
  <ui-score-cards
    [columns]="columns()"
    [table]="cards()"
    [rankBy]="rankBy()"
    [rankOrder]="rankOrder()"
    [rowHead]="rowHead()"
    (rankRequested)="rankByColumn($event)"
  />
} @else {
  <hrs-data-grid
    class="score-table"
    [items]="table()"
    [trackBy]="byKey"
    [rowTheme]="themeOf"
    [sort]="sort()"
    (sortChange)="sort.set($event)"
    sortStart="desc"
  >
    <hrs-column name="head" [header]="rowHeadLabel()" width="max-content">
      <ng-template hrsHeader><span class="score-table__hidden">{{ rowHeadLabel() }}</span></ng-template>
      <ng-template hrsCell let-line>
        <ui-score-row-bar />
        @if (rowHead(); as head) {
          <ng-container
            [ngTemplateOutlet]="head.template"
            [ngTemplateOutletContext]="{ $implicit: line.row.data, row: line.row }"
          />
        }
      </ng-template>
    </hrs-column>
    @for (column of columns(); track column.id; let i = $index) {
      <hrs-column
        [name]="column.id"
        [header]="column.label"
        width="minmax(max-content, 1fr)"
        sortable
        [sortStart]="bestFirst(column)"
      >
        <ng-template hrsHeader>
          <span
            class="score-table__label"
            [matTooltip]="column.description ?? column.label"
            matTooltipPosition="above"
          >
            @if (column.icon) {
              <mat-icon class="material-symbols-outlined score-table__icon" aria-hidden="true">{{
                column.icon
              }}</mat-icon>
              <span class="score-table__hidden">{{ column.label }}</span>
            } @else {
              {{ column.label }}
            }
          </span>
        </ng-template>
        <ng-template hrsCell let-line>
          @let cell = line.cells[i];
          <hrs-number-cell
            [value]="cell.text"
            [shortValue]="cell.compactText"
            [short]="fit() === 'squeezed'"
            styled
            [mark]="cell.best ? 'best' : cell.bestInGroup ? 'group-best' : null"
            groupBestLabel="best on the team"
          />
        </ng-template>
      </hrs-column>
    }
  </hrs-data-grid>
}

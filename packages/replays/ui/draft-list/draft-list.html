<h2 class="title">Draft</h2>
<table class="draft hrs-glass">
  <thead>
    <tr>
      <th scope="col" class="draft__order">#</th>
      <th scope="col">Team</th>
      <th scope="col">Ban or pick</th>
      <th scope="col">Hero</th>
      <th scope="col">Player</th>
    </tr>
  </thead>
  <tbody>
    @for (step of steps(); track step.key) {
      <tr class="step" [class.step--ban]="step.action === 'Ban'" [hrsTeam]="step.team">
        <td class="draft__order">{{ step.order }}</td>
        <td class="step__team">{{ step.teamName }}</td>
        <td>{{ step.action }}</td>
        <th scope="row">
          <span class="step__hero">
            <hrs-hero-minimap-icon [picture]="step.icon?.picture ?? null" [name]="step.hero" />
            {{ step.hero }}
          </span>
        </th>
        <td>{{ step.player }}</td>
      </tr>
    }
  </tbody>
</table>

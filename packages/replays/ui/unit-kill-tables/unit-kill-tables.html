<h2 class="title">Unit Kills</h2>
@if (table() === 'players') {
  <ui-stat-table [columns]="columns" [rows]="playerRows()">
    <ng-template [uiStatRowHead]="playerRows()" let-data>
      <hrs-player-cell [hero]="data.player.hero" [name]="data.player.name" [icon]="data.icon" />
    </ng-template>
  </ui-stat-table>
} @else {
  <ui-stat-table [columns]="columns" [rows]="teamRows()" rowHeadLabel="Team">
    <ng-template [uiStatRowHead]="teamRows()" let-data>{{ data.name }}</ng-template>
  </ui-stat-table>
}

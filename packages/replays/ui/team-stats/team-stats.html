@if (shown(); as group) {
  <!-- the side nav names the section on screen -->
  <h2 class="cdk-visually-hidden">{{ group.title }}</h2>
  <ui-stat-table [columns]="group.columns" [rows]="group.rows" rowHeadLabel="Team">
    <ng-template [uiStatRowHead]="group.rows" let-data>
      <ui-score-team-head [name]="data.name" [result]="data.result ?? null" />
    </ng-template>
  </ui-stat-table>
}

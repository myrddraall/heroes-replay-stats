<h2 class="title">Teams</h2>
@for (group of groups(); track group.id) {
  <section [attr.aria-labelledby]="'teams-' + group.id">
    <h3 class="subtitle" [id]="'teams-' + group.id">{{ group.title }}</h3>
    <ui-stat-table [columns]="group.columns" [rows]="group.rows" rowHeadLabel="Team">
      <ng-template [uiStatRowHead]="group.rows" let-data>
        <span class="team">
          <span class="team__name">{{ data.name }}</span>
          @if (data.result) {
            <span class="team__result">{{ data.result }}</span>
          }
        </span>
      </ng-template>
    </ui-stat-table>
  </section>
}

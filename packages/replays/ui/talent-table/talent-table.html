<h2 class="title">Talents</h2>
<div class="scroll">
  <table class="talents">
    <thead>
      <tr>
        <th scope="col" class="talents__corner">Player</th>
        @for (tier of tiers; track tier) {
          <th scope="col" class="talents__tier">Tier {{ tier }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.key) {
        <tr [attr.data-theme]="row.theme ?? null">
          <th scope="row" class="talents__player">
            <hrs-player-cell [hero]="row.player.hero" [name]="row.player.name" [icon]="row.icon" />
          </th>
          @for (talent of row.talents; track $index) {
            <td class="talents__cell">
              @if (talent) {
                <span class="talent">
                  @if (talent.icon; as icon) {
                    <img class="talent__icon" [hrsSprite]="icon" [spriteWidth]="32" alt="" />
                  }
                  <span class="talent__text">
                    <span class="talent__name">{{ talent.name }}</span>
                    <span class="talent__level">Level {{ talent.level }}</span>
                  </span>
                </span>
              } @else {
                <span class="talents__none">None</span>
              }
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>

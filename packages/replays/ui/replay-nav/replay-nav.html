<nav class="nav" [attr.aria-label]="replay().map + ' pages'">
  <div class="nav__replay">
    <span class="nav__map">{{ replay().map }}</span>
    <span class="nav__mode">{{ mode() }}</span>
  </div>
  @for (group of groups(); track group.title; let i = $index) {
    <button
      type="button"
      class="nav__group"
      [attr.aria-expanded]="!collapsed().has(group.title)"
      [attr.aria-controls]="'replay-nav-group-' + i"
      (click)="toggle(group.title)"
    >
      <mat-icon class="material-symbols-outlined nav__chevron" aria-hidden="true">{{
        collapsed().has(group.title) ? 'chevron_right' : 'expand_more'
      }}</mat-icon>
      {{ group.title }}
    </button>
    @if (!collapsed().has(group.title)) {
      <ul class="nav__pages" [id]="'replay-nav-group-' + i">
        @for (page of group.pages; track page.path) {
          <li>
            <a
              class="nav__page"
              [routerLink]="link(page.path)"
              routerLinkActive="nav__page--active"
              ariaCurrentWhenActive="page"
              >{{ page.title }}</a
            >
          </li>
        }
      </ul>
    }
  }
</nav>

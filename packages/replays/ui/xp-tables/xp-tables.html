<!-- the side nav names the section on screen -->
<h2 class="cdk-visually-hidden">XP</h2>
@if (tables().length === 0) {
  <p class="empty">This replay has no XP over time.</p>
}
@for (table of tables(); track table.team) {
  <section [attr.aria-labelledby]="'xp-team-' + table.team">
    <ui-stat-table [columns]="columns" [rows]="table.rows" rowHeadLabel="Team">
      <!-- the team's name in its card, in its colour, bright -->
      <h3
        uiStatTableTitle
        class="title"
        [id]="'xp-team-' + table.team"
        [attr.theme]="table.color"
        hrsStyledText="bright"
      >
        {{ table.name }}
      </h3>
      <ng-template [uiStatRowHead]="table.rows" let-data>
        <ui-score-team-head [name]="data.name" />
      </ng-template>
    </ui-stat-table>
  </section>
}

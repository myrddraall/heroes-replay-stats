<h2 class="title">XP</h2>
@if (tables().length === 0) {
  <p class="empty">This replay has no XP over time.</p>
}
@for (table of tables(); track table.team) {
  <section [attr.aria-labelledby]="'xp-team-' + table.team">
    <h3 class="subtitle" [id]="'xp-team-' + table.team">{{ table.name }}</h3>
    <ui-stat-table [columns]="columns" [rows]="table.rows" rowHeadLabel="Time">
      <ng-template [uiStatRowHead]="table.rows" let-data>{{ data.time }}</ng-template>
    </ui-stat-table>
  </section>
}

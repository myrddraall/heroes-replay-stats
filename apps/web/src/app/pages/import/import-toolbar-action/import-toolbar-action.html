@if (importPod(); as pod) {
  <div class="import-pod" role="status" aria-live="polite">
    <a
      class="import-pod__status"
      routerLink="/import"
      [attr.aria-label]="pod.label + ', show imports'"
      matTooltip="Show imports"
    >
      <mat-progress-spinner
        class="import-pod__ring"
        mode="determinate"
        [value]="pod.percent"
        diameter="22"
        strokeWidth="3"
      />
      <span class="import-pod__text">{{ handset() ? pod.short : pod.label }}</span>
    </a>
    <button
      mat-icon-button
      class="import-pod__add"
      (click)="imports.import()"
      aria-label="Import more replays"
      matTooltip="Import more replays"
    >
      <mat-icon class="material-symbols-outlined">add</mat-icon>
    </button>
  </div>
} @else if (handset()) {
  <button
    mat-icon-button
    class="hrs-cta"
    (click)="imports.import()"
    aria-label="Import replays"
    matTooltip="Import replays"
  >
    <mat-icon class="material-symbols-outlined">upload_file</mat-icon>
  </button>
} @else {
  <button mat-flat-button class="hrs-cta" (click)="imports.import()">
    <mat-icon class="material-symbols-outlined">upload_file</mat-icon>
    Import replays
  </button>
}
